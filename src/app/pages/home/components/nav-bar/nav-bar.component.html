<section
  style="
    position: fixed;
    top: 0;
    left: 0;
    z-index: 2;
    width: 100%;
    height: fit-content;
  "
  [ngClass]="{ scrollY: isScroll }"
>
  <div class="swiper">
    <div class="swiper-wrapper">
      @for (text of linearHeaders; track $index) {
      <div class="swiper-slide">
        <span> {{ text }} <img src="assets/start.png" alt="" /> </span>
      </div>
      }
    </div>
  </div>

  <nav>
    <div class="navLogo">
      <a (click)="onSelectRoute('container')">
        <img
          src="../../../../../assets/img/header/id_visual.png"
          alt="LogoNodo"
        />
      </a>
    </div>

    <div class="navMenu" #menu>
      <i
        class="material-icons"
        (click)="toggleMenu()"
        [ngClass]="{ 'rotate-icon': isMenuOpen }"
      >
        {{ isMenuOpen ? "clear_all" : "lunch_dining" }}
      </i>
    </div>

    <div class="navOptions">
      @for (route of allRoutes; track $index) {
      <a (click)="onSelectRoute(route.url)">{{ route.title }}</a>
      }
    </div>

    <div class="navContact">
      <button (click)="onWhatsapp()">
        <span> ¡Cotiza Ahora! </span>
        <img src="../../../../../assets/img/header/w-icons.svg" />
      </button>
      <button (click)="selectIdiom()">{{ idiom }}</button>
    </div>

    <div class="navMenuList" [ngClass]="{ show: isMenuOpen }" #lists>
      <div style="width: 100%; height: 40px"></div>
      <div class="nav-contact">
        <div style="display: flex; flex-direction: column">
          <button (click)="onWhatsapp()">
            <span> ¡Cotiza Ahora! </span>
            <img src="../../../../../assets/img/header/w-icons.svg" />
          </button>
          <button (click)="selectIdiom()">{{ idiom }}</button>
        </div>

        <i class="material-icons" (click)="toggleMenu()"> close </i>
      </div>

      <div class="menuActions">
        @for (route of allRoutes; track $index) {
        <a (click)="onSelectRoute(route.url)">{{ route.title }}</a>
        }
      </div>
    </div>
  </nav>
</section>

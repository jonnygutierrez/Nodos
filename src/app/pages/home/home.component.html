<div id="container" #con>
  <!-- NAVBAR -->
  <app-nav-bar (routeSelect)="onNavigate($event)"></app-nav-bar>
  <div class="b-container">
    <div class="sub-title1">
      <span class="txt-b line-1"
        >Creamos <span class="gradient-text">páginas web</span>,</span

    <div class="sub-title2">

        ¿Contáctanos!
      </button>
    </div>
  </div>
</div>

<div
  style="width: 100%; display: flex; padding-inline: 4%; padding-block: 30px"
>

      @for (item of skills; track $index) {
      <div class="swiper-slide">
        <app-card-info [data]="item"></app-card-info>
      </div>
      }
    </div>
  </div>
</div>
